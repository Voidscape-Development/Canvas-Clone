name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-26.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        uses: softprops/action-gh-release@9d7c94cfd0a1f3ed45544c887983e9fa900f0564
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/CHECKSUMS.txt
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

  nightly-release:
    name: Update Nightly Pre-Release 🌙
    if: github.ref_type == 'branch' && (github.ref_name == 'master' || github.ref_name == 'main')
    runs-on: ubuntu-24.04
    needs: build-project
    concurrency:
      group: nightly-release
      cancel-in-progress: true
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      NIGHTLY_TAG: nightly
    steps:
      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4

      - name: Collect Files 🏷️
        run: |
          : Collect Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-26.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          mkdir -p "${root_dir}/nightly"
          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}/nightly"
            done
          done

      - name: Generate Release Notes 🪪
        run: |
          : Generate Release Notes 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          notes="${{ github.workspace }}/NIGHTLY.md"
          {
            echo "Rolling development build of \`${GITHUB_REF_NAME}\`, rebuilt every time a commit lands."
            echo "These builds are untested and may be unstable; use a tagged release for production."
            echo
            echo "**Commit:** ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"
            echo "**Built:** $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "### Checksums"
            for file in nightly/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
              echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)"
            done
          } > "${notes}"

      - name: Publish Nightly Pre-Release 🌙
        run: |
          : Publish Nightly Pre-Release 🌙
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          files=(nightly/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip))
          if (( ${#files[@]} == 0 )); then
            echo '::error::No build artifacts found to publish.'
            exit 1
          fi

          # Replace the previous nightly release and move its tag to this commit.
          gh release delete "${NIGHTLY_TAG}" --cleanup-tag --yes || true
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${NIGHTLY_TAG}" || true

          gh release create "${NIGHTLY_TAG}" \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --latest=false \
            --title "${{ needs.build-project.outputs.pluginName }} Nightly (${GITHUB_SHA:0:9})" \
            --notes-file "${{ github.workspace }}/NIGHTLY.md" \
            "${files[@]}"
